<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}CinemaVault{% endblock %}</title>
  {{ bootstrap.load_css() }}
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
  <nav class="site-nav"><a class="brand" href="{{ url_for('home') }}"><span class="brand-icon">▶</span> Cinema<span>Vault</span></a>
    <a class="nav-add" href="{{ url_for('add_movie') }}">+ Add a movie</a>
  </nav>
  <main class="page-shell">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}<div class="alert alert-{{ category }}" role="alert">{{ message }}</div>{% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
  <footer>Personal movie collection • Powered by TMDB</footer>
</body>
</html>
